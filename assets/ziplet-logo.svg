<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 34 282 66" role="img" aria-labelledby="title desc">
  <title id="title">ziplet logo</title>
  <desc id="desc">A macOS-style blue app icon showing square brackets around a dot, next to the ziplet wordmark.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4aa0ff"/>
      <stop offset="55%" stop-color="#1f66f0"/>
      <stop offset="100%" stop-color="#0b2a86"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="0" y2="1">
