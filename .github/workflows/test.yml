name: test

run-name: >-
  ${{
    github.event_name == 'pull_request' &&
    github.event.pull_request.title ||
    format('{0}-{1}', github.ref_name, github.sha)
  }}

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run typos
        run: uvx typos

      - name: Run ruff check
        run: uvx ruff check .

      - name: Run ruff format
        run: uvx ruff format --check .

  ty:
    name: ty
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run ty check
        run: uv run --all-extras --group dev --with ty ty check

  basedpyright:
    name: basedpyright
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Run basedpyright
        run: uv run --all-extras --group dev --with basedpyright basedpyright

  mypy:
    name: mypy ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install project and dev dependencies
        run: uv sync --all-extras

      - name: Run mypy --strict
        run: uv run mypy --strict src tests

  pytest-unit:
    name: pytest unit ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [lint, ty, basedpyright, mypy]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install project and dev dependencies
        run: uv sync --all-extras

      - name: Run pytest with coverage
        run: uv run pytest -v tests/unit --cov=src/zipctl --cov-report=term

  pytest-functional:
    name: pytest functional ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: [lint, ty, basedpyright, mypy]
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install project and dev dependencies
        run: uv sync --all-extras

      - name: Run pytest with coverage
        run: uv run pytest -v tests/functional --cov=src/zipctl --cov-report=term

  pytest-windows-7zip:
    name: 7-zip
    runs-on: windows-latest
    needs: [lint, ty, basedpyright, mypy]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Verify 7-Zip
        shell: pwsh
        run: 7z i

      - name: Install project and dev dependencies
        run: uv sync --all-extras

      - name: Run 7-Zip interoperability tests
        run: uv run pytest -v -m windows tests/functional/test_7zip_interop.py tests/functional/cli/test_7zip_cli.py
